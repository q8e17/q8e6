<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q8x14 | Connect</title>
    <!-- Core library for social media brand logos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #06070a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.07);
            --text-color: #ffffff;
            --text-secondary: #8e939e;
            --hover-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #171923 0%, var(--bg-color) 75%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Clean neon profile ring style */
        .profile-avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            border: 2px solid transparent;
            background: linear-gradient(var(--bg-color), var(--bg-color)) padding-box,
                        linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899) border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
        }

        .profile-avatar i {
            font-size: 2rem;
            color: #8b5cf6;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease-in-out;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Sizing and alignment for the brand logos */
        .link-content i {
            font-size: 1.35rem;
            width: 24px;
            text-align: center;
            display: inline-block;
        }

        /* Custom official colors for each logo */
        .fa-tiktok { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        .fa-instagram { color: #f75274; }
        .fa-whatsapp { color: #25d366; }
        .fa-discord { color: #5865f2; }

        .arrow-icon {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.3;
            transition: transform 0.2s ease;
        }

        /* Mobile touch feedback physics */
        .link-card:active {
            transform: scale(0.97);
            background-color: var(--hover-bg);
            border-color: rgba(255, 255, 255, 0.18);
        }
        
        .link-card:active .arrow-icon {
            transform: translateX(4px);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <div class="profile-avatar">
            <i class="fas fa-user-astronaut"></i>
        </div>
        <h1>@q8x14</h1>
        <p class="bio">Connect with me</p>

        <!-- Social Buttons -->
        <div class="links-container">
            <!-- TikTok Button -->
            <a href="https://tiktok.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fab fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Instagram Button -->
            <a href="https://instagram.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- WhatsApp Button -->
            <a href="https://wa.me" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fab fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Discord Button -->
            <a href="https://discord.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fab fa-discord"></i>
                    <span>Discord</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>
    </div>

</body>
</html>
